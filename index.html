<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fcfbf8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="瞬間英作文">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<title>瞬間英作文の本</title>
<style>
:root{
  --paper:#fcfbf8; --paper2:#f6f4ef; --gutter:#e6e2d9;
  --ink:#262220; --ink-soft:#8d857a; --rule:#e7e3da; --rule2:#d9d4c8;
  --accent:#8a3f2e;
  --sat:env(safe-area-inset-top); --sal:env(safe-area-inset-left); --sar:env(safe-area-inset-right);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);
  -webkit-text-size-adjust:100%;overscroll-behavior:none}
body{font-family:"Hiragino Mincho ProN","Hiragino Mincho Pro","Yu Mincho","YuMincho","IPAMincho",serif;
  color:var(--ink);user-select:none;-webkit-user-select:none}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}

/* ============ 本 ============ */
#stage{position:fixed;inset:0;perspective:1600px;overflow:hidden;touch-action:none}
#book{position:absolute;inset:0;
  background:linear-gradient(90deg,var(--paper) 0%,var(--paper) 44%,var(--paper2) 48.6%,
    var(--gutter) 49.7%,#ded9ce 50%,var(--gutter) 50.3%,var(--paper2) 51.4%,var(--paper) 56%,var(--paper) 100%);
  transition:transform .38s cubic-bezier(.22,.61,.36,1);transform-origin:100% 0%}
#book.zoomed{transform:scale(2.15)}

.page{position:absolute;top:0;bottom:0;width:50%;
  padding:calc(10px + var(--sat)) 18px 6px}
.page.left{left:0;padding-left:calc(18px + var(--sal));padding-right:26px}
.page.right{right:0;padding-right:calc(18px + var(--sar));padding-left:26px}

.hdr{font-size:11.5px;letter-spacing:.04em;color:var(--ink-soft);
  border-bottom:1px solid var(--rule2);padding-bottom:5px;
  display:flex;gap:8px;align-items:baseline;white-space:nowrap;overflow:hidden}
.hdr b{font-weight:400;color:var(--ink);font-size:13px;flex:none}
.hdr .tpl{font-family:Georgia,"Times New Roman",serif;font-style:italic;color:var(--accent);
  overflow:hidden;text-overflow:ellipsis}
.hdr.ghost{visibility:hidden}
.page.left .hdr{padding-left:24px}

ol.lines{list-style:none;margin:9px 0 0;padding:0}
ol.lines li{display:flex;gap:7px;align-items:flex-start;
  min-height:calc((100vh - 86px) / 5);padding:6px 0 5px;border-bottom:1px solid var(--rule)}
.num{font-size:12px;color:var(--ink-soft);width:15px;flex:none;padding-top:3px}
.ja{font-size:16.5px;line-height:1.45}
.en{font-family:Georgia,"Times New Roman",serif;font-size:16px;line-height:1.45;color:#241d18;flex:1}
.en.hidden{height:20px;margin-top:3px;
  background:repeating-linear-gradient(90deg,#cfc9bc 0 7px,transparent 7px 14px);
  background-size:100% 1px;background-repeat:no-repeat;background-position:0 70%}
.en.hidden::after{content:"tap";font-family:Georgia,serif;font-size:9.5px;color:#b3aa9b;
  letter-spacing:.14em;position:relative;top:-7px;left:2px}
.en.show{animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(2px)}to{opacity:1;transform:none}}

.pno{position:absolute;bottom:4px;font-size:10.5px;color:var(--ink-soft);font-family:Georgia,serif}
.page.left .pno{left:calc(18px + var(--sal))}
.page.right .pno{right:calc(18px + var(--sar))}

/* 右上＝書き込み、左上＝目次 */
.corner,.tocbtn{position:absolute;top:0;width:48px;height:42px;z-index:3;
  display:flex;align-items:flex-start}
.corner{right:0;justify-content:flex-end;padding:6px 8px 0 0}
.tocbtn{left:0;justify-content:flex-start;padding:5px 0 0 8px;font-size:14px;color:#a79f92}
.corner::before{content:"";position:absolute;top:0;right:0;width:0;height:0;
  border-top:28px solid #eceae3;border-left:28px solid transparent}
.badge{position:relative;font-size:10.5px;color:#6f675c;font-family:Georgia,serif;letter-spacing:.01em}
.badge.none{color:#c3bcae}

/* めくり */
#flip{position:absolute;top:0;height:100%;width:50%;z-index:6;display:none;will-change:transform}
#flip.fwd{left:50%;transform-origin:left center}
#flip.bwd{left:0;transform-origin:right center}
#flipFace{position:absolute;inset:0;overflow:hidden;background:var(--paper);
  box-shadow:0 0 26px rgba(60,50,35,.22)}
#flipFace .page{width:100%;left:0;right:0}
#flipShade{position:absolute;inset:0;pointer-events:none;z-index:5;display:none;opacity:0;
  background:linear-gradient(90deg,rgba(60,50,35,0) 40%,rgba(60,50,35,.16) 100%)}

/* ============ 覆い ============ */
.sheet{position:fixed;inset:0;z-index:30;display:none;background:var(--paper);
  padding:calc(12px + var(--sat)) calc(22px + var(--sar)) 10px calc(22px + var(--sal));
  overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet.on{display:block}
.sheet h1{font-size:15px;margin:0 0 1px;letter-spacing:.3em;font-weight:400}
.sheet .sub{font-size:10px;color:var(--ink-soft);font-family:Georgia,serif;letter-spacing:.1em}
.sheet .x{position:fixed;top:calc(8px + var(--sat));right:calc(14px + var(--sar));
  font-size:17px;color:var(--ink-soft);padding:8px 10px;z-index:2}

#tocList{margin-top:10px;display:grid;grid-template-columns:1fr 1fr;gap:0 30px}
.trow{display:flex;align-items:baseline;gap:6px;padding:7px 4px;border-bottom:1px solid var(--rule);
  width:100%;text-align:left}
.trow .ch{font-size:13px;white-space:nowrap}
.trow .tpl{font-family:Georgia,serif;font-style:italic;font-size:11.5px;color:var(--accent);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .dots{flex:1;border-bottom:1px dotted var(--rule2);transform:translateY(-3px);min-width:10px}
.trow .p{font-family:Georgia,serif;font-size:11px;color:var(--ink-soft);flex:none}
.trow.cur{background:#f3f0e9}
.trow.cur .ch::before{content:"❧ ";color:var(--accent)}
#tocFoot{margin-top:14px;display:flex;gap:10px;align-items:center}
.lnk{font-size:12px;color:var(--accent);border-bottom:1px solid #e3d2cc;padding-bottom:1px}
#tocFoot .muted{font-size:10.5px;color:var(--ink-soft);margin-left:auto}

/* 書き込み */
#memo{position:fixed;left:0;right:0;top:0;z-index:40;display:none;
  padding:calc(8px + var(--sat)) calc(14px + var(--sar)) 0 calc(14px + var(--sal))}
#memo.on{display:block}
#memo .card{height:100%;background:#fff;border:1px solid #e4e0d7;border-radius:8px;
  box-shadow:0 12px 30px rgba(40,35,25,.18);padding:9px 14px 10px;display:flex;flex-direction:column}
#memo .top{display:flex;align-items:baseline;gap:10px;border-bottom:1px solid #eeebe4;padding-bottom:6px}
#memo .date{font-family:Georgia,serif;font-size:15px;color:var(--accent);flex:none}
#memo .ttl{font-size:11.5px;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#memo .close{margin-left:auto;font-size:15px;color:var(--ink-soft);padding:2px 4px;flex:none}
#memo .field{margin-top:8px;display:flex;gap:8px;align-items:center;flex:none}
#memo input[type=text]{flex:1;min-width:0;border:1px solid #e0dbd1;border-radius:6px;background:#fcfbf8;
  padding:8px 9px;font-size:16px;outline:none;user-select:text;-webkit-user-select:text}
#memo input[type=text]:focus{border-color:#cdbfae}
#memo .save{background:var(--accent);color:#fff;border-radius:6px;padding:9px 16px;font-size:13px;flex:none}
#memo .save:disabled{opacity:.35}
#memo .hlabel{margin-top:9px;font-size:10.5px;color:var(--ink-soft);letter-spacing:.08em;flex:none}
#memo ul{list-style:none;margin:2px 0 0;padding:0;overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
#memo li{display:flex;gap:9px;font-size:12.5px;padding:4px 0;border-bottom:1px solid #f0ede6}
#memo li b{font-family:Georgia,serif;color:var(--accent);width:36px;flex:none;font-weight:400}
#memo li span{flex:1;user-select:text;-webkit-user-select:text}
#memo li button{color:#c9c2b6;font-size:11px;padding:0 2px;flex:none}
#memo .empty{font-size:12px;color:#bdb6a9;padding:6px 0}
#dim{position:fixed;inset:0;background:rgba(35,30,22,.28);z-index:35;display:none}
#dim.on{display:block}

/* 文の追加 */
#add .row{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
#add label{font-size:11px;color:var(--ink-soft);width:52px;flex:none}
#add input,#add select{flex:1;min-width:120px;border:1px solid #e0dbd1;border-radius:6px;
  background:#fff;padding:8px 9px;font-size:16px;outline:none;user-select:text;-webkit-user-select:text}
#add .btn{background:var(--accent);color:#fff;border-radius:6px;padding:9px 18px;font-size:13px}
#add .btn.ghost{background:#fff;color:var(--ink);border:1px solid #ded9cf}
#add .note{font-size:11px;color:var(--ink-soft);margin-top:10px;line-height:1.6}
#add .ok{font-size:12px;color:var(--accent);margin-left:6px}
#mine{list-style:none;padding:0;margin:8px 0 0}
#mine li{display:flex;gap:8px;font-size:12.5px;padding:5px 0;border-bottom:1px solid var(--rule);align-items:baseline}
#mine li i{font-style:normal;font-size:10px;color:var(--ink-soft);width:78px;flex:none;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#mine li span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#mine li em{font-style:italic;font-family:Georgia,serif;color:#5d564c;flex:1;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#mine li button{color:#c0b8aa;font-size:11px;flex:none}
#jsonOut{width:100%;height:150px;margin-top:8px;border:1px solid #e0dbd1;border-radius:6px;
  padding:8px;font-family:ui-monospace,Menlo,monospace;font-size:11px;display:none;
  user-select:text;-webkit-user-select:text;background:#fff}
.hr{height:1px;background:var(--rule);margin:14px 0 2px}
.cap{font-size:11px;color:var(--ink-soft);letter-spacing:.06em;margin-top:12px}

/* 縦向き */
#rot{position:fixed;inset:0;z-index:60;display:none;background:var(--paper2);color:#3a342e;
  flex-direction:column;align-items:center;justify-content:center;gap:22px;font-size:16px}
#rot .ph{width:92px;height:168px;border:2.5px solid #b9b1a3;border-radius:14px;position:relative;
  animation:tilt 2.4s ease-in-out infinite}
#rot .ph::after{content:"";position:absolute;left:50%;bottom:7px;transform:translateX(-50%);
  width:34px;height:3px;border-radius:2px;background:#b9b1a3}
@keyframes tilt{0%,45%{transform:rotate(0)}70%,100%{transform:rotate(-90deg)}}
#rot small{font-size:11px;color:#a39b8d;letter-spacing:.1em}
@media (orientation:portrait){#rot{display:flex}}

#boot{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;
  background:var(--paper);font-size:13px;color:var(--ink-soft)}
#boot.off{display:none}
</style>
</head>
<body>

<div id="stage">
  <div id="book">
    <div class="page left" id="pL"></div>
    <div class="page right" id="pR"></div>
  </div>
  <div id="flipShade"></div>
  <div id="flip"><div id="flipFace"></div></div>
</div>

<div id="dim"></div>

<div id="memo"><div class="card">
  <div class="top">
    <span class="date" id="mDate"></span>
    <span class="ttl" id="mTtl"></span>
    <button class="close" id="mClose">✕</button>
  </div>
  <div class="field">
    <input type="text" id="mInput" placeholder="ひとこと（例：③で詰まった）" maxlength="120"
           autocomplete="off" autocapitalize="off" enterkeyhint="done">
    <button class="save" id="mSave">保存</button>
  </div>
  <div class="hlabel">これまでの書き込み</div>
  <ul id="mList"></ul>
</div></div>

<div class="sheet" id="toc">
  <button class="x" data-close="toc">✕</button>
  <h1>目 次</h1>
  <div class="sub">SHUNKAN EISAKUBUN</div>
  <div id="tocList"></div>
  <div id="tocFoot">
    <button class="lnk" id="openAdd">＋ 文を追加する</button>
    <span class="muted" id="tocStat"></span>
  </div>
</div>

<div class="sheet" id="add">
  <button class="x" data-close="add">✕</button>
  <h1>文 の 追 加</h1>
  <div class="sub">ADD SENTENCES</div>
  <div class="row">
    <label>章</label>
    <select id="aCh"></select>
  </div>
  <div class="row" id="aNewRow" style="display:none">
    <label>章の名前</label>
    <input type="text" id="aChTitle" placeholder="第3章 動名詞">
    <input type="text" id="aChTpl" placeholder="V-ing is adj.">
  </div>
  <div class="row"><label>和文</label><input type="text" id="aJa" placeholder="英語を話すのは楽しい。"></div>
  <div class="row"><label>英文</label><input type="text" id="aEn" placeholder="It is fun to speak English."></div>
  <div class="row">
    <label></label>
    <button class="btn" id="aAdd">追加</button>
    <button class="btn ghost" id="aJson">JSONを書き出す</button>
    <span class="ok" id="aOk"></span>
  </div>
  <textarea id="jsonOut" readonly></textarea>
  <div class="note">
    追加した文はこの端末に保存され、すぐ本に反映されます。<br>
    「JSONを書き出す」で出た中身を <b>data/sentences.json</b> に貼り替えると、本体のデータになります。
  </div>
  <div class="hr"></div>
  <div class="cap">この端末で追加した文</div>
  <ul id="mine"></ul>
</div>

<div id="rot"><div class="ph"></div><div>横向きにしてください</div><small>PLEASE ROTATE YOUR DEVICE</small></div>
<div id="boot">読み込み中…</div>

<script>
'use strict';
const K={notes:'sb.notes',mark:'sb.bookmark',custom:'sb.custom',ver:'sb.ver'};
const MARK=['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩'];
const PER=5, FIRST_PAGE=4;
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const jget=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}};
const jset=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}};

let BASE={title:'',chapters:[]}, CH=[], SP=[], idx=0;
let NOTES=jget(K.notes,{}), CUSTOM=jget(K.custom,{appends:{},chapters:[]});
if(!CUSTOM.appends)CUSTOM.appends={}; if(!CUSTOM.chapters)CUSTOM.chapters=[];

/* ---------- データ合成 ---------- */
function build(){
  CH=BASE.chapters.map(c=>({...c,sentences:[...c.sentences,...(CUSTOM.appends[c.id]||[])]}));
  CUSTOM.chapters.forEach(c=>CH.push({...c,sentences:[...c.sentences]}));
  SP=[];
  CH.forEach((c,ci)=>{
    for(let i=0;i<c.sentences.length;i+=PER){
      const items=c.sentences.slice(i,i+PER);
      SP.push({ci,ch:c,items,key:items[0]?items[0].id:c.id+'-e'+i});
    }
    if(!c.sentences.length)SP.push({ci,ch:c,items:[],key:c.id+'-empty'});
  });
  SP.forEach((s,i)=>{s.pL=FIRST_PAGE+i*2;s.pR=FIRST_PAGE+i*2+1;});
  if(idx>=SP.length)idx=Math.max(0,SP.length-1);
}

/* ---------- 描画 ---------- */
function leftHTML(s){
  const li=s.items.map((t,i)=>
    `<li><span class="num">${MARK[i]||''}</span><span class="ja">${esc(t.ja)}</span></li>`).join('');
  return `<div class="tocbtn" data-toc>❧</div>`
    +`<div class="hdr"><b>${esc(s.ch.title)}</b><span>／</span><span class="tpl">${esc(s.ch.template||'')}</span></div>`
    +`<ol class="lines">${li}</ol><div class="pno">p.${s.pL}</div>`;
}
function rightHTML(s){
  const n=(NOTES[s.key]||[]).length;
  const li=s.items.map((t,i)=>
    `<li><span class="num">${MARK[i]||''}</span><span class="en hidden" data-en="${esc(t.en)}"></span></li>`).join('');
  return `<div class="hdr ghost"><b>${esc(s.ch.title)}</b></div>`
    +`<ol class="lines">${li}</ol><div class="pno">p.${s.pR}</div>`
    +`<div class="corner" data-corner><span class="badge${n?'':' none'}">${n?'✓'+n:'✓'}</span></div>`;
}
function render(){
  const s=SP[idx]; if(!s)return;
  $('#pL').innerHTML=leftHTML(s);
  $('#pR').innerHTML=rightHTML(s);
  jset(K.mark,s.key);
}

/* ---------- 英文の開閉 ---------- */
$('#pR').addEventListener('click',e=>{
  const el=e.target.closest('.en'); if(!el||$('#book').classList.contains('zoomed'))return;
  if(el.classList.contains('hidden')){el.textContent=el.dataset.en;el.classList.remove('hidden');el.classList.add('show');}
  else{el.textContent='';el.classList.add('hidden');el.classList.remove('show');}
});

/* ---------- めくり ---------- */
let drag=null, busy=false;
const flip=$('#flip'), shade=$('#flipShade');

let fd=null;
function setupFlip(dir){
  const cur=SP[idx], tgt=SP[idx+dir]; if(!tgt)return false;
  if(dir===1){
    flip.className='fwd';
    fd={front:`<div class="page right">${rightHTML(cur)}</div>`,
        back:`<div class="page left">${leftHTML(tgt)}</div>`,side:null};
    $('#pR').innerHTML=rightHTML(tgt);
  }else{
    flip.className='bwd';
    fd={front:`<div class="page left">${leftHTML(cur)}</div>`,
        back:`<div class="page right">${rightHTML(tgt)}</div>`,side:null};
    $('#pL').innerHTML=leftHTML(tgt);
  }
  flip.style.display='block'; shade.style.display='block';
  return true;
}
// 90°を境に表／裏を差し替える（backface-visibility に頼らない）
function face(p){
  const s=p<0.5?'f':'b'; if(!fd||fd.side===s)return; fd.side=s;
  const el=$('#flipFace');
  el.innerHTML=(s==='f'?fd.front:fd.back);
  el.style.transform=(s==='f'?'none':'rotateY(180deg)');
}
function setFlip(dir,p){
  face(p);
  flip.style.transition='none';
  flip.style.transform='rotateY('+(dir===1?-180*p:180*p)+'deg)';
  shade.style.opacity=String(0.85*Math.sin(Math.PI*p));
}
function endFlip(dir,go){
  busy=true; flip.style.transition='transform .34s cubic-bezier(.3,.7,.4,1)';
  flip.style.transform='rotateY('+(go?(dir===1?-180:180):0)+'deg)';
  shade.style.transition='opacity .34s linear'; shade.style.opacity='0';
  setTimeout(()=>face(go?1:0),150);
  setTimeout(()=>{
    if(go)idx+=dir;
    flip.style.transition='none';flip.style.transform='';flip.style.display='none';
    shade.style.transition='none';shade.style.display='none';
    $('#flipFace').innerHTML=''; $('#flipFace').style.transform='none'; fd=null;
    render(); busy=false;
  },350);
}
function turn(dir){
  if(busy||!SP[idx+dir])return;
  if(!setupFlip(dir))return;
  setFlip(dir,0.001); requestAnimationFrame(()=>endFlip(dir,true));
}

$('#stage').addEventListener('pointerdown',e=>{
  if(busy||$('#book').classList.contains('zoomed'))return;
  if(e.target.closest('[data-corner]')){openMemo();return;}
  if(e.target.closest('[data-toc]')){openSheet('toc');return;}
  drag={x:e.clientX,y:e.clientY,t:Date.now(),dir:0,on:false};
},{passive:true});

$('#stage').addEventListener('pointermove',e=>{
  if(!drag||busy)return;
  const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
  if(!drag.on){
    if(Math.abs(dx)<10||Math.abs(dx)<Math.abs(dy)*1.2)return;
    const dir=dx<0?1:-1;
    if(!setupFlip(dir)){drag=null;return;}
    drag.on=true; drag.dir=dir; drag.x=e.clientX;
  }
  const p=Math.min(1,Math.max(0,(drag.dir===1?-(e.clientX-drag.x):(e.clientX-drag.x))/(innerWidth*0.55)));
  setFlip(drag.dir,p); drag.p=p;
},{passive:true});

function release(e){
  if(!drag)return; const d=drag; drag=null;
  if(!d.on)return;
  const fast=(Date.now()-d.t)<320 && (d.p||0)>0.12;
  endFlip(d.dir,(d.p||0)>0.34||fast);
}
$('#stage').addEventListener('pointerup',release);
$('#stage').addEventListener('pointercancel',release);
addEventListener('keydown',e=>{
  if($('#memo').classList.contains('on')||$$('.sheet.on').length)return;
  if(e.key==='ArrowRight')turn(1); if(e.key==='ArrowLeft')turn(-1);
});

/* ---------- 書き込み ---------- */
const memo=$('#memo'), mList=$('#mList'), mInput=$('#mInput');
const fmt=iso=>{const d=new Date(iso);return (d.getMonth()+1)+'/'+d.getDate();};
function fitMemo(){
  const vh=(window.visualViewport&&window.visualViewport.height)||innerHeight;
  memo.style.height=Math.round(Math.min(vh-6,innerHeight*0.64))+'px';
}
function drawNotes(){
  const s=SP[idx], list=NOTES[s.key]||[];
  mList.innerHTML=list.length
    ? list.slice().reverse().map(n=>
        `<li><b>${fmt(n.d)}</b><span>${esc(n.t)}</span><button data-del="${esc(n.d)}">削除</button></li>`).join('')
    : '<li class="empty">まだありません</li>';
}
function openMemo(){
  const s=SP[idx];
  $('#mDate').textContent=fmt(new Date().toISOString());
  $('#mTtl').textContent=s.ch.title+' ・ p.'+s.pL+'–'+s.pR;
  mInput.value=''; drawNotes(); fitMemo();
  $('#book').classList.add('zoomed'); $('#dim').classList.add('on'); memo.classList.add('on');
  setTimeout(()=>mInput.focus(),260);
}
function closeMemo(){
  mInput.blur(); memo.classList.remove('on'); $('#dim').classList.remove('on');
  $('#book').classList.remove('zoomed'); render();
}
$('#mClose').onclick=closeMemo;
$('#dim').onclick=closeMemo;
$('#mSave').onclick=()=>{
  const t=mInput.value.trim(); if(!t)return;
  const s=SP[idx]; (NOTES[s.key]=NOTES[s.key]||[]).push({d:new Date().toISOString(),t});
  jset(K.notes,NOTES); mInput.value=''; drawNotes();
};
mInput.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('#mSave').click();}});
mList.addEventListener('click',e=>{
  const b=e.target.closest('[data-del]'); if(!b)return;
  const s=SP[idx]; NOTES[s.key]=(NOTES[s.key]||[]).filter(n=>n.d!==b.dataset.del);
  if(!NOTES[s.key].length)delete NOTES[s.key];
  jset(K.notes,NOTES); drawNotes();
});
if(window.visualViewport){
  visualViewport.addEventListener('resize',()=>{if(memo.classList.contains('on')){fitMemo();scrollTo(0,0);}});
}

/* ---------- 覆いの開閉 ---------- */
function openSheet(id){
  if(id==='toc')drawToc(); if(id==='add')drawAdd();
  $('#'+id).classList.add('on');
}
$$('[data-close]').forEach(b=>b.onclick=()=>$('#'+b.dataset.close).classList.remove('on'));

/* ---------- 目次 ---------- */
function drawToc(){
  const rows=CH.map((c,ci)=>{
    const first=SP.findIndex(s=>s.ci===ci);
    return `<button class="trow${SP[idx].ci===ci?' cur':''}" data-go="${first}">`
      +`<span class="ch">${esc(c.title)}</span>`
      +`<span class="tpl">${esc(c.template||'')}</span>`
      +`<span class="dots"></span><span class="p">p.${SP[first].pL}</span></button>`;
  });
  const half=Math.ceil(rows.length/2);
  $('#tocList').innerHTML='<div>'+rows.slice(0,half).join('')+'</div><div>'+rows.slice(half).join('')+'</div>';
  const n=CH.reduce((a,c)=>a+c.sentences.length,0);
  $('#tocStat').textContent=CH.length+'章 ／ '+n+'文 ／ '+SP.length+'見開き';
}
$('#tocList').addEventListener('click',e=>{
  const b=e.target.closest('[data-go]'); if(!b)return;
  idx=+b.dataset.go; render(); $('#toc').classList.remove('on');
});
$('#openAdd').onclick=()=>{$('#toc').classList.remove('on');openSheet('add');};

/* ---------- 文の追加 ---------- */
function drawAdd(){
  const sel=$('#aCh'), prev=sel.value;
  sel.innerHTML=CH.map(c=>`<option value="${esc(c.id)}">${esc(c.title)}</option>`).join('')
    +'<option value="__new">＋ 新しい章をつくる</option>';
  if(prev)sel.value=prev; if(!sel.value)sel.value=CH[SP[idx].ci].id;
  onChSel(); drawMine(); $('#jsonOut').style.display='none'; $('#aOk').textContent='';
}
function onChSel(){ $('#aNewRow').style.display=$('#aCh').value==='__new'?'flex':'none'; }
$('#aCh').onchange=onChSel;

function drawMine(){
  const rows=[];
  Object.keys(CUSTOM.appends).forEach(cid=>{
    const c=CH.find(x=>x.id===cid);
    (CUSTOM.appends[cid]||[]).forEach(s=>rows.push({ch:c?c.title:cid,s}));
  });
  CUSTOM.chapters.forEach(c=>c.sentences.forEach(s=>rows.push({ch:c.title,s})));
  $('#mine').innerHTML=rows.length
    ? rows.map(r=>`<li><i>${esc(r.ch)}</i><span>${esc(r.s.ja)}</span>`
        +`<em>${esc(r.s.en)}</em><button data-rm="${esc(r.s.id)}">削除</button></li>`).join('')
    : '<li style="color:#bdb6a9;border:0">まだありません</li>';
}
$('#mine').addEventListener('click',e=>{
  const b=e.target.closest('[data-rm]'); if(!b)return;
  const id=b.dataset.rm;
  Object.keys(CUSTOM.appends).forEach(k=>{CUSTOM.appends[k]=CUSTOM.appends[k].filter(s=>s.id!==id);});
  CUSTOM.chapters.forEach(c=>{c.sentences=c.sentences.filter(s=>s.id!==id);});
  jset(K.custom,CUSTOM); build(); render(); drawMine();
});

$('#aAdd').onclick=()=>{
  const ja=$('#aJa').value.trim(), en=$('#aEn').value.trim();
  if(!ja||!en){$('#aOk').textContent='和文と英文の両方を入れてください';return;}
  const id='u'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
  if($('#aCh').value==='__new'){
    const t=$('#aChTitle').value.trim();
    if(!t){$('#aOk').textContent='章の名前を入れてください';return;}
    const cid='c'+Date.now().toString(36);
    CUSTOM.chapters.push({id:cid,title:t,template:$('#aChTpl').value.trim(),sentences:[{id,ja,en}]});
    jset(K.custom,CUSTOM); build();
    $('#aChTitle').value='';$('#aChTpl').value='';
    drawAdd(); $('#aCh').value=cid; onChSel();
  }else{
    const cid=$('#aCh').value;
    (CUSTOM.appends[cid]=CUSTOM.appends[cid]||[]).push({id,ja,en});
    jset(K.custom,CUSTOM); build(); drawMine();
  }
  $('#aJa').value='';$('#aEn').value='';$('#aJa').focus();
  $('#aOk').textContent='追加しました ✓'; render();
};
$('#aJson').onclick=()=>{
  const out={title:BASE.title,chapters:CH.map(c=>({id:c.id,title:c.title,template:c.template||'',
    sentences:c.sentences.map(s=>({id:s.id,ja:s.ja,en:s.en}))}))};
  const ta=$('#jsonOut'); ta.value=JSON.stringify(out,null,2);
  ta.style.display='block'; ta.focus(); ta.select();
  if(navigator.clipboard)navigator.clipboard.writeText(ta.value).then(
    ()=>{$('#aOk').textContent='コピーしました ✓';},()=>{$('#aOk').textContent='全選択しました';});
};

/* ---------- 起動 ---------- */
fetch('./data/sentences.json',{cache:'no-cache'}).then(r=>r.json()).then(d=>{
  BASE=d; build();
  const mk=jget(K.mark,null); const i=SP.findIndex(s=>s.key===mk);
  idx=i>=0?i:0;
  render(); $('#boot').classList.add('off');
}).catch(err=>{
  $('#boot').textContent='データを読み込めませんでした（'+err.message+'）';
});

if('serviceWorker' in navigator && location.protocol==='https:'){
  addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
addEventListener('resize',()=>{if(memo.classList.contains('on'))fitMemo();});
document.addEventListener('gesturestart',e=>e.preventDefault());
</script>
</body>
</html>
